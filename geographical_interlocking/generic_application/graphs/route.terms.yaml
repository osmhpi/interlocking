entity_type: Transit
terms:
  RouteRequested:
    expression: (
        RouteFindingSearch[@infrastructure_element].Check == RouteChecking::CHECK_START &&
        RouteFindingResponse[@infrastructure_element].Admit != RouteAdmission::INACTIVE
      ) || (
        Any(link in @upstream_link_right | LinkLTR[link].State == RouteSearch::ROUTE_SET) ||
        Any(link in @upstream_link_left | LinkRTL[link].State == RouteSearch::ROUTE_SET)
      )
    default: false
  MatchesDiversion:
    # (Check == A|C && Admit == A|C) == !empty(requires_point_left)
    expression: (
        (
          (
            RouteFindingSearch[@infrastructure_element].Check == RouteChecking::CHECK_FROM_B &&
            RouteFindingResponse[@infrastructure_element].Admit == RouteAdmission::ADMIT_TO_A
          ) || (
            (
              RouteFindingSearch[@infrastructure_element].Check == RouteChecking::CHECK_START ||
              RouteFindingSearch[@infrastructure_element].Check == RouteChecking::CHECK_FROM_A
            ) && (
              RouteFindingResponse[@infrastructure_element].Admit == RouteAdmission::ADMIT_TO_B ||
              RouteFindingResponse[@infrastructure_element].Admit == RouteAdmission::ADMIT_END
            )
          )
        ) && (
            All(point in @requires_point_left | PointNominalPosition[point].State != PointState::LEFT) &&
            All(point in @requires_point_left | PointNominalPosition[point].State != PointState::RIGHT) &&
            All(point in @requires_point_left | PointNominalPosition[point].State != PointState::UNDETERMINED)
        )
      ) || (
        (
          (
            RouteFindingSearch[@infrastructure_element].Check == RouteChecking::CHECK_FROM_A &&
            RouteFindingResponse[@infrastructure_element].Admit == RouteAdmission::ADMIT_TO_C
          ) || (
            RouteFindingSearch[@infrastructure_element].Check == RouteChecking::CHECK_FROM_C &&
            RouteFindingResponse[@infrastructure_element].Admit == RouteAdmission::ADMIT_TO_A
          )
        ) && (
          Any(point in @requires_point_left | PointNominalPosition[point].State == PointState::LEFT) ||
          Any(point in @requires_point_left | PointNominalPosition[point].State == PointState::RIGHT) ||
          Any(point in @requires_point_left | PointNominalPosition[point].State == PointState::UNDETERMINED)
        )
      )
    default: false
  MatchesDirection:
    expression: Any(link in @upstream_link_left | LinkRTL[link].State == RouteSearch::ROUTE_SET) ||
        Any(link in @upstream_link_right | LinkLTR[link].State == RouteSearch::ROUTE_SET) ||
        Any(link in @downstream_link_left | LinkRTL[link].State == RouteSearch::RESPONSE) ||
        Any(link in @downstream_link_right | LinkLTR[link].State == RouteSearch::RESPONSE)
    default: false
  PointsAvailable:
    expression: All(point in @requires_point_right | PointNominalPosition[point].State == PointState::RIGHT) &&
                All(point in @requires_point_left | PointNominalPosition[point].State == PointState::LEFT)
    default: true
  NoIncompatibleRoutes:
    default: true
  AutomaticReleaseEffective:
    expression: RouteAutomaticRelease.State == ActiveInactive::ACTIVE
    default: false
  ManualReleaseEffective:
    expression: RouteManualRelease.ManualReleaseRequested == ActiveInactive::ACTIVE
    default: false
  RouteBecameUnset:
    expression: Any(link in @upstream_link_right | LinkLTR[link].State == RouteSearch::INACTIVE) ||
        Any(link in @upstream_link_left | LinkRTL[link].State == RouteSearch::INACTIVE)
    default: false
variables:
  State:
    type: RouteState
    description: Indicates whether the route is released or set.
    default: RouteState::RELEASED
